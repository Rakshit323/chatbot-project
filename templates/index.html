<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- //responsiveness for mobile devices -->

    <title>Website Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  <!-- //load bootstrap css -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">  <!-- //load bootstrap-icons -->

    <link rel="stylesheet" href="../static/css/chatbot.css">   <!-- // load css file -->

</head>

<body>
    <p>sample website  for testing</p>



    <button id="chatButton" class="chat-button">  <!-- //floating chatbot button -->
        <i class="bi bi-chat-dots-fill"></i>
    </button>



    <div class="chat-box" id="chatBox">  <!-- // main chatbot window -->



        <div class="chat-header">   <!-- // top blue bar -->

            <div class="header-left">

                <div class="avatar">
                    <img src="../static/images/bot-avatar.png" alt="Bot Avatar">
                </div>

                <div>

                    <h5>WebDesign Bot</h5>

                    <div class="status">
                        <i class="bi bi-circle-fill"></i> Online
                    </div>

                </div>

            </div>

            <div class="header-right">

                <button id="refreshChat" title="Refresh">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>

                <button id="closeChat" title="Close">
                    <i class="bi bi-x-lg"></i>
                </button>

            </div>

        </div>



        <div class="chat-body"> <!-- //chat body -->

            <div class="welcome-message">

                <p>👋 Welcome!</p>

                <p>
                    I'm your website assistant. I can help you understand our services,
                    answer your questions, and collect your project requirements.
                </p>

            </div>

            <div class="quick-buttons" id="quickButtons">  <!-- //quick buttons -->

             <button>Business Website</button>

             <button>Portfolio Website</button>

             <button>E-Commerce Website</button>

             <button>Blog Website</button>

             <button>Educational Website</button>

            </div>


            <div id="chatMessages"></div> <!-- // bot and user messages are inserted in this, initially empty -->

        </div>

        <div id="attachmentPreview" class="attachment-preview" style="display:none;"></div> <!-- //shows attached files , initially empty -->


    
        <div class="chat-input"> <!-- //user input section -->

            <button id="attachButton" class="attach-btn" title="Attach File">
                <i class="bi bi-paperclip"></i>
            </button>
            
            <input
             type="file"
             multiple
             id="fileInput"
             accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg"
             hidden
            >

            <input type="text" id="userInput" placeholder="Type your message...">  <!-- text input area -->

            <button class="send-btn" id="sendButton" title="Send">
                <i class="bi bi-send-fill"></i>
            </button>

        </div>

    </div>

    <script src="../static/js/chatbot.js"></script>  <!-- load javascript -->

</body>

</html>
